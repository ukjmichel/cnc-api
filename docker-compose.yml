name: cnc-api

services:
  db:
    image: mysql:8.0
    container_name: cnc_mysql
    command: --default-authentication-plugin=mysql_native_password --lower_case_table_names=1
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appdb}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: UTC
    ports:
      - '${HOST_MYSQL_PORT:-3314}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: cnc_mongodb
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-appdb}
      TZ: UTC
    ports:
      - '${HOST_MONGO_PORT:-27017}:27017'
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-init:
    image: mysql:8.0
    container_name: cnc_mysql_init
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./mysql-init:/mysql-init:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      '
      set -e;
      echo "Waiting for DB and applying init SQL...";
      mysql -h db -uroot -p"$MYSQL_ROOT_PASSWORD" < /mysql-init/10-base.sql;
      mysql -h db -uroot -p"$MYSQL_ROOT_PASSWORD" < /mysql-init/20-dev-test.sql;
      echo "Init SQL applied.";
      '
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cnc_api
    env_file:
      - .env
    environment:
      TZ: UTC
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - '${HOST_APP_PORT:-3000}:${PORT:-3000}'
    volumes:
      # Source files for testing
      - ./src:/usr/src/app/src
      - ./jest.config.ts:/usr/src/app/jest.config.ts
      - ./jest.setup.env.ts:/usr/src/app/jest.setup.env.ts
      - ./tsconfig.json:/usr/src/app/tsconfig.json
      - ./tsconfig.jest.json:/usr/src/app/tsconfig.jest.json
      # Uploads directory only
      - ./uploads:/usr/src/app/uploads
    restart: unless-stopped

volumes:
  mysql_data:
  mongodb_data: